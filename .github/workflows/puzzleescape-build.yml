name: PuzzleEscape Build

on:
  push:
    branches: [puzzleescape-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct PuzzleEscape source
        run: |
          cat puzzleescape-src-b64/part-* > PuzzleEscape-build-src.tar.gz.b64
          base64 -d PuzzleEscape-build-src.tar.gz.b64 > PuzzleEscape-build-src.tar.gz
          gzip -t PuzzleEscape-build-src.tar.gz
          mkdir project
          tar -xzf PuzzleEscape-build-src.tar.gz -C project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build and test
        working-directory: project
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload distributable jar
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleEscape-1.0.0
          path: project/build/libs/PuzzleEscape-1.0.0.jar
          if-no-files-found: error
