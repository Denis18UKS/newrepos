name: PuzzleEscape Build

on:
  push:
    branches:
      - puzzleescape-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct PuzzleEscape source
        run: |
          cat puzzleescape-src-b64/part-* > PuzzleEscape-build-src.tar.gz.b64
          base64 -d PuzzleEscape-build-src.tar.gz.b64 > PuzzleEscape-build-src.tar.gz
          gzip -t PuzzleEscape-build-src.tar.gz
          mkdir project
          tar -xzf PuzzleEscape-build-src.tar.gz -C project

      - name: Apply 1.20.1 packet signature fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          entity = Path('project/src/main/java/dev/denis18uks/puzzleescape/entity/PuzzlePieceEntity.java')
          text = entity.read_text()
          text = text.replace('    @Override\n    public boolean collides() { return true; }\n\n', '')
          entity.write_text(text)

          for filename in ('PuzzleCanvasBlockEntity.java', 'PuzzleTriggerBlockEntity.java'):
              path = Path('project/src/main/java/dev/denis18uks/puzzleescape/block') / filename
              text = path.read_text()
              if 'net.minecraft.network.listener.ClientPlayPacketListener;' not in text:
                  text = text.replace(
                      'import net.minecraft.nbt.NbtCompound;\n',
                      'import net.minecraft.nbt.NbtCompound;\nimport net.minecraft.network.listener.ClientPlayPacketListener;\n'
                  )
              text = text.replace(
                  'public @Nullable Packet<?> toUpdatePacket()',
                  'public @Nullable Packet<ClientPlayPacketListener> toUpdatePacket()'
              )
              path.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build and test
        working-directory: project
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload distributable jar
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleEscape-1.0.0-1.20.1
          path: project/build/libs/PuzzleEscape-1.0.0-1.20.1.jar
          if-no-files-found: error
